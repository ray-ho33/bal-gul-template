name: Collect article candidates

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-candidates-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Require default branch dispatch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ! [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo "This workflow must be dispatched from the default branch." >&2
            exit 1
          fi

      - name: Check out the dispatched revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vendor/requirements.txt

      - name: Install collection dependencies
        run: python -m pip install --requirement vendor/requirements.txt

      - name: Set KST run date
        run: |
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          echo "CANDIDATE_PATH=data/candidates-$RUN_DATE.json" >> "$GITHUB_ENV"

      - name: Remove the ephemeral same-day candidate
        run: rm -f -- "data/candidates-$RUN_DATE.json"

      - name: Collect candidates
        run: |
          COLLECT_EXIT=0
          python scraper/collect.py --date "$RUN_DATE" || COLLECT_EXIT=$?
          echo "COLLECT_EXIT=$COLLECT_EXIT" >> "$GITHUB_ENV"

      - name: Validate candidate handoff
        id: validate
        env:
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from scraper.schema import read_candidate_file

          path = Path(os.environ["CANDIDATE_PATH"])
          run_date = os.environ["RUN_DATE"]
          expected_run_url = os.environ["EXPECTED_RUN_URL"]
          expected_sha = os.environ["EXPECTED_SHA"]
          document = read_candidate_file(path)

          if document.run_date.isoformat() != run_date:
              raise SystemExit("candidate run_date does not match its KST filename date")
          if document.generated_at.astimezone(ZoneInfo("Asia/Seoul")).date().isoformat() != run_date:
              raise SystemExit("candidate generated_at is not on the KST run date")
          if document.workflow_run_url != expected_run_url:
              raise SystemExit("candidate workflow_run_url does not identify this run")
          if document.collector_commit_sha != expected_sha:
              raise SystemExit("candidate collector_commit_sha does not identify checkout")
          if document.stats.sites_total != 88:
              raise SystemExit("candidate stats do not cover the 88-site registry")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"sites_succeeded={document.stats.sites_succeeded}\n")
          PY

      - name: Commit only the candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$CANDIDATE_PATH"
          STAGED="$(git diff --cached --name-only)"
          if [[ "$STAGED" != "$CANDIDATE_PATH" ]]; then
            echo "Unexpected staged paths: $STAGED" >&2
            exit 1
          fi
          git commit -m "data: $RUN_DATE 기사 후보 수집" -- "$CANDIDATE_PATH"

      - name: Rebase and push candidate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"

          PUSH_LOG="$(mktemp)"
          trap 'rm -f "$PUSH_LOG"' EXIT
          if git push origin "HEAD:$DEFAULT_BRANCH" 2>"$PUSH_LOG"; then
            cat "$PUSH_LOG" >&2
          else
            cat "$PUSH_LOG" >&2
            if ! grep -Eq '\[rejected\]|non-fast-forward|fetch first' "$PUSH_LOG"; then
              exit 1
            fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Enforce collection readiness
        env:
          SITES_SUCCEEDED: ${{ steps.validate.outputs.sites_succeeded }}
        run: |
          if [[ "$COLLECT_EXIT" -ne 0 || "$SITES_SUCCEEDED" -lt 55 ]]; then
            echo "Collection readiness failed: exit=$COLLECT_EXIT sites=$SITES_SUCCEEDED" >&2
            exit 1
          fi
