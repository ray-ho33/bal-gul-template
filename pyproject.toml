[project]
name = "bal-gul"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "curl-cffi>=0.15.0",
    "pydantic>=2.12,<3",
    "pyyaml",
    "requests",
]

[dependency-groups]
dev = [
    "basedpyright",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
extend-exclude = ["vendor"]
src = ["scraper", "tests"]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "INP001", "PLR2004", "S101", "SLF001"]

[tool.basedpyright]
include = ["scraper", "tests"]
exclude = ["vendor"]
pythonVersion = "3.11"
typeCheckingMode = "all"
